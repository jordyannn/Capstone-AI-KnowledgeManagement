events {}

http {
    # DNS bawaan Docker. Tanpa ini Nginx me-resolve "backend"/"frontend" sekali saat start dan terus
    # memakai IP lama; setelah container di-recreate (mis. `docker compose up -d --build`) semua
    # permintaan jadi 502 sampai Nginx di-restart. Dengan resolver + variabel, nama di-resolve ulang
    # tiap 10 detik.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
